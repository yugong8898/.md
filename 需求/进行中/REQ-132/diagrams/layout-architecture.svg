<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-size: 12px; fill: #666; }
      .box-label { font-size: 13px; font-weight: 600; fill: #fff; }
      .box-sub { font-size: 11px; fill: rgba(255,255,255,0.85); }
      .dim-label { font-size: 11px; fill: #999; }
      .arrow-label { font-size: 11px; fill: #5653F8; font-weight: 600; }
      .note { font-size: 11px; fill: #e74c3c; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" rx="12" fill="#f8f9fc"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" class="title">es-web 服务商工作台 — 页面布局架构</text>
  <text x="480" y="56" text-anchor="middle" class="subtitle">REQ-132 · 最终确认版（2026-10-21）· max-width: 1440px</text>

  <!-- ===== WelcomeSection (full width) ===== -->
  <rect x="60" y="80" width="840" height="80" rx="10" fill="#5653F8" opacity="0.12"/>
  <rect x="60" y="80" width="840" height="80" rx="10" fill="none" stroke="#5653F8" stroke-width="2"/>
  <text x="80" y="108" class="box-label" fill="#5653F8">WelcomeSection</text>
  <text x="80" y="126" class="box-sub" fill="#5653F8">问候语 + 信用标签 + 身份标签</text>
  <rect x="620" y="90" width="120" height="28" rx="6" fill="#5653F8" opacity="0.2"/>
  <text x="680" y="109" text-anchor="middle" font-size="11" fill="#5653F8">了解接单规则 btn</text>
  <rect x="750" y="90" width="140" height="56" rx="8" fill="#5653F8" opacity="0.15" stroke="#5653F8" stroke-width="1"/>
  <text x="820" y="113" text-anchor="middle" font-size="11" fill="#5653F8" font-weight="600">发布服务卡片</text>
  <text x="820" y="130" text-anchor="middle" font-size="10" fill="#5653F8">R-026 从 ActionCenter 迁入</text>

  <!-- Dimension: full width -->
  <line x1="60" y1="170" x2="900" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="4"/>
  <text x="480" y="184" text-anchor="middle" class="dim-label">← 全宽 (max 1440px) →</text>

  <!-- ===== main-content ===== -->
  <rect x="60" y="195" width="840" height="380" rx="10" fill="none" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6"/>
  <text x="480" y="214" text-anchor="middle" class="dim-label">main-content (flex, gap: 16px)</text>

  <!-- Left Column -->
  <rect x="70" y="225" width="560" height="340" rx="8" fill="#e8f4fd" opacity="0.3"/>
  <rect x="70" y="225" width="560" height="340" rx="8" fill="none" stroke="#74b9ff" stroke-width="1.5"/>
  <text x="90" y="246" font-size="13" font-weight="700" fill="#0984e3">left-column (flex: 1)</text>

  <!-- MetricCards -->
  <rect x="85" y="258" width="530" height="56" rx="8" fill="#0984e3" opacity="0.15" stroke="#0984e3" stroke-width="1.5"/>
  <text x="100" y="280" font-size="13" font-weight="600" fill="#0984e3">MetricCards</text>
  <text x="100" y="298" font-size="11" fill="#0984e3">4 张指标卡 · grid repeat(4, minmax(168px, 1fr))</text>
  <text x="520" y="280" font-size="10" fill="#0984e3">R-022/R-023 子项计数</text>
  <text x="520" y="298" font-size="10" fill="#0984e3">自包含 · 读 store</text>

  <!-- OpportunityRecommendModule -->
  <rect x="85" y="324" width="530" height="56" rx="8" fill="#6c5ce7" opacity="0.12" stroke="#6c5ce7" stroke-width="1.5"/>
  <text x="100" y="346" font-size="13" font-weight="600" fill="#6c5ce7">OpportunityRecommendModule</text>
  <text x="100" y="364" font-size="11" fill="#6c5ce7">商机推荐 · 一行 3-4 个 · 左右滑动 · 上限 6</text>
  <text x="520" y="346" font-size="10" fill="#6c5ce7">文件夹包裹</text>
  <text x="520" y="364" font-size="10" fill="#6c5ce7">+ Skeleton/Error/Empty</text>

  <!-- dynamic-row -->
  <rect x="85" y="390" width="530" height="100" rx="8" fill="#00b894" opacity="0.1" stroke="#00b894" stroke-width="1.5"/>
  <text x="100" y="410" font-size="12" font-weight="600" fill="#00b894">dynamic-row (flex, gap: 16px)</text>

  <!-- OrderDynamicModule -->
  <rect x="100" y="420" width="250" height="58" rx="6" fill="#00b894" opacity="0.15" stroke="#00b894" stroke-width="1"/>
  <text x="115" y="440" font-size="12" font-weight="600" fill="#00b894">OrderDynamicModule</text>
  <text x="115" y="458" font-size="10" fill="#00b894">订单动态 · 待缴保证金/待提交交付物</text>
  <text x="115" y="472" font-size="10" fill="#00b894">上限 6 条 · 2 条可视高度</text>

  <!-- AfterSaleDynamicModule -->
  <rect x="360" y="420" width="240" height="58" rx="6" fill="#00b894" opacity="0.15" stroke="#00b894" stroke-width="1"/>
  <text x="375" y="440" font-size="12" font-weight="600" fill="#00b894">AfterSaleDynamicModule</text>
  <text x="375" y="458" font-size="10" fill="#00b894">售后动态 · 仅返工/仅退款/退款+返工</text>
  <text x="375" y="472" font-size="10" fill="#00b894">上限 6 条 · 2 条可视高度</text>

  <!-- CertificationPlaceholder (v-else) -->
  <rect x="85" y="500" width="530" height="50" rx="8" fill="#fdcb6e" opacity="0.2" stroke="#e17055" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="100" y="522" font-size="12" font-weight="600" fill="#e17055">CertificationPlaceholder (v-else)</text>
  <text x="100" y="540" font-size="11" fill="#e17055">未认证时替换左列三模块 · 蓝色底平台介绍图</text>

  <!-- Arrow: certified? -->
  <line x1="350" y1="490" x2="350" y2="500" stroke="#e17055" stroke-width="1.5"/>
  <text x="360" y="497" font-size="10" fill="#e17055">v-if="certified"</text>

  <!-- Right Column -->
  <rect x="645" y="225" width="245" height="340" rx="8" fill="#ffeaa7" opacity="0.2"/>
  <rect x="645" y="225" width="245" height="340" rx="8" fill="none" stroke="#fdcb6e" stroke-width="1.5"/>
  <text x="660" y="246" font-size="13" font-weight="700" fill="#d68910">right-column (461px)</text>

  <!-- ActionCenter -->
  <rect x="660" y="258" width="215" height="120" rx="8" fill="#fdcb6e" opacity="0.2" stroke="#fdcb6e" stroke-width="1.5"/>
  <text x="675" y="280" font-size="13" font-weight="600" fill="#d68910">ActionCenter</text>
  <text x="675" y="298" font-size="11" fill="#d68910">消息中心（原行动中心改名）</text>
  <text x="675" y="316" font-size="10" fill="#d68910">R-024 移至右列 · R-025 去处理 disabled</text>
  <text x="675" y="334" font-size="10" fill="#d68910">R-026 发布服务已迁出 → WelcomeSection</text>
  <text x="675" y="356" font-size="10" fill="#d68910">自包含 · 读 store</text>

  <!-- SupplierCtaCard -->
  <rect x="660" y="390" width="215" height="160" rx="8" fill="#e17055" opacity="0.12" stroke="#e17055" stroke-width="1.5"/>
  <text x="675" y="412" font-size="13" font-weight="600" fill="#e17055">SupplierCtaCard</text>
  <text x="675" y="430" font-size="11" fill="#e17055">供应商工作台引导卡</text>
  <text x="675" y="450" font-size="10" fill="#e17055"> UncertifiedCard (未认证)</text>
  <text x="675" y="466" font-size="10" fill="#e17055">├ SupplierRegisterCard (已认证未入驻)</text>
  <text x="675" y="482" font-size="10" fill="#e17055">└ SupplierWorkbenchCard (已入驻)</text>
  <text x="675" y="504" font-size="10" fill="#e17055">certified 由父组件 prop 传入</text>
  <text x="675" y="520" font-size="10" fill="#e17055">自包含 · useSupplierCtaCard composable</text>
  <text x="675" y="538" font-size="10" fill="#e17055">align-self: center (不撑满右列)</text>

  <!-- ProviderGuideOverlay (floating) -->
  <rect x="60" y="585" width="200" height="28" rx="6" fill="#a29bfe" opacity="0.15" stroke="#a29bfe" stroke-width="1"/>
  <text x="160" y="604" text-anchor="middle" font-size="11" fill="#6c5ce7">ProviderGuideOverlay (浮层)</text>

  <!-- Modal group -->
  <rect x="280" y="585" width="420" height="28" rx="6" fill="#fd79a8" opacity="0.1" stroke="#fd79a8" stroke-width="1"/>
  <text x="490" y="604" text-anchor="middle" font-size="11" fill="#e84393">SupplierAuthRequiredModal · SupplierWalletRequiredModal · SupplierEligibilityModal</text>

  <!-- Legend -->
  <rect x="720" y="585" width="180" height="28" rx="6" fill="#dfe6e9"/>
  <text x="810" y="604" text-anchor="middle" font-size="10" fill="#636e72">蓝色=自包含 · 黄色=消息 · 红色=CTA</text>
</svg>
